server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /www/dualweb;
    index index.html;
    client_max_body_size 8m;

    location /api/ {
        proxy_pass http://127.0.0.1:9091/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Zashboard static frontend, independently updateable.
    location ^~ /zashboard/ {
        alias /www/dualweb/zashboard/;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Isolated Open-Box lite frontend for port 80. Its static files are a build-time
    # copy; API calls are forwarded to the same 3036 backend without touching its UI.
    location = /openbox-lite { return 301 /openbox-lite/; }
    location ^~ /openbox-lite/api/ {
        include /etc/dualweb/openbox-lite-backend.conf;
        rewrite ^/openbox-lite/api/(.*)$ /api/$1 break;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass $openbox_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location ^~ /openbox-lite/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        root /www/dualweb;
        try_files $uri $uri/ /openbox-lite/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Open-Box panel on local port 3036, exposed under the same-origin /openbox/ path.
    # Rewrite API requests into the prefix so they do not collide with DualWeb's own /api/.
    location = /openbox { return 301 /openbox/; }
    location ^~ /openbox/api/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3036/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location ^~ /openbox/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3036/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_redirect / /openbox/;
        proxy_cookie_path / /openbox/;
    }

    # Same-origin reverse proxy for the Clash-compatible API.
    # Current image includes Nikki/Mihomo; OpenClash can also be used if it listens on 9090.
    location = /clash { return 301 /clash/; }
    location ^~ /clash/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / { try_files $uri $uri/ /index.html; }
}
