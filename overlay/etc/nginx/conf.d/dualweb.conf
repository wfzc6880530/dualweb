server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /www/dualweb;
    index index.html;
    client_max_body_size 8m;

    location /api/ {
        proxy_pass http://127.0.0.1:9091/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Zashboard static frontend, independently updateable.
    location ^~ /zashboard/ {
        alias /www/dualweb/zashboard/;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Same-origin reverse proxy for the Clash-compatible API.
    # Current image includes Nikki/Mihomo; OpenClash can also be used if it listens on 9090.
    location = /clash { return 301 /clash/; }
    location ^~ /clash/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / { try_files $uri $uri/ /index.html; }
}
