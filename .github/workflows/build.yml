name: Build Dual Web

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'ImmortalWrt stable release'
        required: true
        default: '25.12.2'

  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'overlay/**'
      - 'src/**'
      - 'build.sh'
      - 'packages.txt'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      RELEASE: ${{ inputs.release || '25.12.2' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y \
            zstd \
            gzip \
            xz-utils \
            curl \
            wget \
            tar \
            jq \
            golang-go \
            qemu-utils

      - name: Verify build tools
        run: |
          set -eu

          echo "========== qemu-img =========="
          command -v qemu-img
          qemu-img --version

          echo "========== Go =========="
          go version

          echo "========== Build script =========="
          test -s ./build.sh
          chmod +x ./build.sh
          bash -n ./build.sh

          echo "========== Project files =========="
          test -f packages.txt
          test -d overlay
          test -d src

          echo "ImmortalWrt release: $RELEASE"

      - name: Build ImageBuilder image
        shell: bash
        run: |
          set -Eeuo pipefail
          bash ./build.sh

      - name: Check firmware output
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ ! -d output ]; then
            echo "::error::output directory does not exist"
            echo "Check the output copy step in build.sh"
            exit 1
          fi

          echo "========== Firmware files =========="
          find output -maxdepth 2 -type f \
            -printf '%p (%s bytes)\n'

          if ! find output -maxdepth 2 -type f \
            \( -name '*.img' \
            -o -name '*.img.gz' \
            -o -name '*.qcow2' \
            -o -name '*.vdi' \
            -o -name '*.vmdk' \
            -o -name '*.combined*' \
            -o -name '*.bin' \
            -o -name '*.vhdx' \) \
            -print -quit | grep -q .; then
            echo "::error::No recognized firmware image found"
            exit 1
          fi

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86-64-dualweb
          path: output/**
          if-no-files-found: error
          retention-days: 30

      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "Build failed. Inspect the first failed step."
          echo "Check ImageBuilder logs and output paths."
