name: Build Dual Web

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'ImmortalWrt stable release'
        required: true
        default: '25.12.2'

  pull_request:
    branches:
      - main
      - feature/2026-10-20-dualweb-openbox-zashboard
    paths:
      - '.github/workflows/**'
      - 'overlay/**'
      - 'src/**'
      - 'build.sh'
      - 'packages.txt'
      - 'README.md'

  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'overlay/**'
      - 'src/**'
      - 'build.sh'
      - 'packages.txt'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      RELEASE: ${{ inputs.release || '25.12.2' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            zstd \
            gzip \
            xz-utils \
            curl \
            wget \
            tar \
            jq \
            golang-go \
            qemu-utils \
            genisoimage

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========== qemu-img =========="
          command -v qemu-img
          qemu-img --version

          echo "========== mkisofs =========="
          command -v mkisofs
          mkisofs --version || true

          echo "========== Go =========="
          go version

          echo "========== Project files =========="
          test -s build.sh
          test -s packages.txt
          test -d overlay
          test -s src/main.go

          chmod +x build.sh
          bash -n build.sh

          echo "ImmortalWrt release: ${RELEASE}"

      - name: Build firmware
        shell: bash
        run: |
          set -Eeuo pipefail
          bash ./build.sh

      - name: Inspect firmware output
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ ! -d output ]; then
            echo "::error::output directory does not exist"
            exit 1
          fi

          echo "========== Generated files =========="
          find output -maxdepth 2 -type f \
            -printf '%p (%s bytes)\n'

          if ! find output -maxdepth 1 -type f \
            \( -name '*.img' \
            -o -name '*.img.gz' \
            -o -name '*.qcow2' \
            -o -name '*.vdi' \
            -o -name '*.vmdk' \
            -o -name '*.vhdx' \
            -o -name '*.iso' \
            -o -name '*.combined*' \
            -o -name '*.bin' \) \
            -print -quit | grep -q .; then
            echo "::error::No firmware image found in output/"
            exit 1
          fi

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86-64-dualweb
          path: output/**
          if-no-files-found: error
          retention-days: 30

      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "Build failed. Review the first failed step."
          echo "Check ImageBuilder logs, package dependencies and output files."
